# OpenOCD configuration for STM32N6 with ST-Link V3
# Flashing FSBL to external QSPI flash

# Use ST-Link V3
source [find interface/stlink.cfg]

# STM32N6 target (similar to H7)
set CHIPNAME stm32n6
set WORKAREASIZE 0x40000

# Target configuration
transport select hla_swd
set CPUTAPID 0x6ba02477

# Create target
target create $_CHIPNAME.cpu cortex_m -dap $_CHIPNAME.dap

# Set up work area in SRAM
$_CHIPNAME.cpu configure -work-area-phys 0x34000000 -work-area-size $WORKAREASIZE -work-area-backup 0

# Clock configuration - reduce for reliability
adapter speed 4000

# Reset configuration
reset_config srst_only srst_nogate

# Initialize
init

# Halt target
reset halt

# Configure XSPI for external flash access
# Enable XSPI1 clock
mww 0x580244E0 0x00004000

# Configure XSPI1 for memory-mapped mode
# Base address: 0x70000000 (XSPI1)
mww 0x70000000 0x00000000  ;# CR - Reset
mww 0x70000004 0x01000000  ;# DCR - 16MB flash
mww 0x70000014 0x00000003  ;# CCR - Memory-mapped mode

# Flash programming commands
proc flash_fsbl {filename addr} {
    echo "Flashing FSBL to external memory at $addr"
    
    # Load binary to SRAM first
    load_image $filename 0x34100000 bin
    
    # Copy from SRAM to external flash
    # This would need custom flash algorithm for QSPI
    echo "Note: Direct QSPI programming requires external loader"
    echo "Use STM32CubeProgrammer for production flashing"
}

# Helper to load FSBL to SRAM for testing
proc load_fsbl_sram {filename} {
    echo "Loading FSBL directly to SRAM for testing"
    load_image $filename 0x34000000 bin
    echo "FSBL loaded to SRAM at 0x34000000"
    echo "Set PC to 0x34000200 and run"
}